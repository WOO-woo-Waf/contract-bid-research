[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-bid-research"
version = "0.1.0"
description = "Evaluation primitives for contract-review and bid-generation research"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=artifacts/test_tmp -q"

[tool.setuptools.packages.find]
where = ["src"]
