[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-bid-research"
version = "0.1.0"
description = "Evaluation primitives for contract-review and bid-generation research"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
contract-bid-infra = "contract_bid_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=artifacts/test_tmp -q"

[tool.setuptools.packages.find]
where = ["src"]
